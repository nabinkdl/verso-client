services:
  postgres:
    image: postgres:16-alpine
    container_name: mononet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mononet
      POSTGRES_PASSWORD: mononet
      POSTGRES_DB: mononet
    ports:
      - '5432:5432'
    volumes:
      - mononet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mononet -d mononet']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mononet-postgres-data:
